name: dt-ai-observability-lab

# ---------------------------------------------------------------------------
# Perfiles:
#   (por defecto)      -> phoenix + otelcol   (pipeline "manual", Fase 3)
#   --profile bindplane -> agrega BindPlane OP + Postgres + Prometheus (Fase 2)
#
# Arranque incremental:
#   Fase 3:  docker compose up -d
#   Fase 2:  docker compose --profile bindplane up -d
# ---------------------------------------------------------------------------

services:
  # ======================= AI Observability: Arize Phoenix ==================
  phoenix:
    image: arizephoenix/phoenix:latest   # pin una versión estable en Fase 3 (ej. :8.x)
    container_name: phoenix
    ports:
      - "6006:6006"   # UI web + OTLP HTTP  (endpoint de ingesta: http://phoenix:6006/v1/traces)
      - "4317:4317"   # OTLP gRPC
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

  # ============ OTel Collector standalone (el "antes" — Fase 3) =============
  # En Fase 2 este colector se reemplaza por uno GESTIONADO por BindPlane,
  # para sentir la diferencia entre editar YAML a mano vs. controlar el
  # pipeline desde la UI (fleets, processors, routing).
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    env_file: .env
    ports:
      - "4318:4318"    # OTLP HTTP  -> los agentes exportan AQUÍ
      - "14317:4317"   # OTLP gRPC  (remapeado para no chocar con Phoenix:4317)
    depends_on:
      - phoenix
    restart: unless-stopped

  # ==================== BindPlane OP (Fase 2 — profile) =====================
  # Requiere una licencia GRATUITA (BINDPLANE_LICENSE) desde
  # https://bindplane.com/download . Verificá tags/vars en la Fase 2.
  bindplane:
    image: ghcr.io/observiq/bindplane-ee:1.89.5
    container_name: bindplane
    profiles: ["bindplane"]
    ports:
      - "3001:3001"
    environment:
      - BINDPLANE_ACCEPT_EULA=true
      - BINDPLANE_LICENSE=${BINDPLANE_LICENSE}
      - BINDPLANE_USERNAME=${BINDPLANE_USERNAME}
      - BINDPLANE_PASSWORD=${BINDPLANE_PASSWORD}
      - BINDPLANE_SESSION_SECRET=${BINDPLANE_SESSION_SECRET}
      - BINDPLANE_REMOTE_URL=${BINDPLANE_REMOTE_URL}
      - BINDPLANE_STORE_TYPE=postgres
      - BINDPLANE_POSTGRES_HOST=postgres
      - BINDPLANE_POSTGRES_PORT=5432
      - BINDPLANE_POSTGRES_USERNAME=postgres
      - BINDPLANE_POSTGRES_PASSWORD=postgres
      - BINDPLANE_POSTGRES_DATABASE=bindplane
      - BINDPLANE_PROMETHEUS_ENABLE_REMOTE=true
      - BINDPLANE_PROMETHEUS_HOST=bindplane-prometheus
      - BINDPLANE_PROMETHEUS_PORT=9090
    depends_on:
      - postgres
      - bindplane-prometheus
      - bindplane-transform
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: bindplane-postgres
    profiles: ["bindplane"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bindplane
    volumes:
      - bindplane-pg:/var/lib/postgresql/data
    restart: unless-stopped

  bindplane-prometheus:
    image: ghcr.io/observiq/bindplane-prometheus:1.89.5
    container_name: bindplane-prometheus
    profiles: ["bindplane"]
    volumes:
      - bindplane-prom:/prometheus
    restart: unless-stopped

  bindplane-transform:
    image: ghcr.io/observiq/bindplane-transform-agent:1.89.5-bindplane
    container_name: bindplane-transform
    profiles: ["bindplane"]
    restart: unless-stopped

volumes:
  phoenix-data:
  bindplane-pg:
  bindplane-prom:
